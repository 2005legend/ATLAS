#!/usr/sbin/nft -f
table inet hermes_guard
delete table inet hermes_guard
table inet hermes_guard {
  set allowed_v4 { type ipv4_addr; elements = { 127.0.0.1, VM1_TAILSCALE_IP } }
  chain input {
    type filter hook input priority 0; policy accept;
    tcp dport { 11434, 8000 } ip saddr @allowed_v4 accept
    tcp dport { 11434, 8000 } iifname "lo" accept
    tcp dport { 11434, 8000 } drop
  }
  chain output {
    type filter hook output priority 0; policy accept;
    meta skuid "dsh-runner" ip daddr 100.64.0.0/10 drop
  }
  chain forward {
    type filter hook forward priority -10; policy accept;
    iifname "tailscale0" tcp dport 3001 ip saddr != { VM1_TAILSCALE_IP, LAPTOP_TAILSCALE_IP } drop
  }
}

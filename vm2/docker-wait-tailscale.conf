# freellmapi publishes its port on the Tailscale IP, so Docker must start after that IP exists.
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 90); do ip -4 addr show tailscale0 2>/dev/null | grep -q "inet 100\." && exit 0; sleep 1; done; echo "tailscale IP not up after 90 s; continuing"; exit 0'

#!/usr/sbin/nft -f
# Only our own table: never "flush ruleset" (that would wipe Docker's rules).
table inet hermes_guard
delete table inet hermes_guard
table inet hermes_guard {
  chain input {
    type filter hook input priority 0; policy accept;
    tcp dport 8100 iifname "lo" accept
    tcp dport 8100 ip saddr LAPTOP_TAILSCALE_IP accept
    tcp dport 8100 drop
  }
}
